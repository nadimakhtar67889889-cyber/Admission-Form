<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addmission Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-card">
        <div class="form-title">
            <span>ADMISSION 2026</span>
            <h1>Apply for Admission</h1>
            <p>Fill in your details to start your application</p>
        </div>
        <form>
            <div class="row">
                <div class="field">
                    <label>First Name</label>
                    <input type="text" placeholder="Enter your first name">
                </div>
                <div class="field">
                    <label>Last Name</label>
                    <input type="text" placeholder="Enter your last name">
                </div>
            </div>
            <div class="field">
                <label>Enter Email</label>
                <input type="email" placeholder="Enter your email">
            </div>
            <div class="row">
                <div class="field">
                    <label>phone</label>
                    <input type="tel" placeholder="0987654321"> 
                </div>
                <div class="field">
                    <label>Date of Birth</label>
                    <input type="date">
                </div>
            </div>
            <div class="field">
                <label>Course</label>
                <select>
                    <option>Select a Course</option>
                    <option>Computer Science</option>
                    <option>Mathematics and Computing</option>
                    <option>Electrical Engineering</option>
                    <option>Chemical Engineering</option>
                </select>
            </div>
            <div class="field">
                <label>Address</label>
                <textarea placeholder="Enter your address"></textarea>
            </div>

            <label class="check">
                <input type="checkbox">
                <span>I agree to the admission terms and conditions</span>
            </label>
            <button type="submit">Submit Application</button>

        </form>
    </div>  
</body>
</html>
